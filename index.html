<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletín Noticias - Leroy Merlin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lm-green': '#6cc24a',
                        'lm-dark': '#5aa33e',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; /* Evita scroll horizontal si Richie se va muy al borde */
        }
        /* Efecto al pasar el ratón por encima de la noticia */
        .tarjeta-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .tarjeta-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.15);
        }
        .contenedor-imagen {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .contenedor-imagen img, .contenedor-imagen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            outline: none;
        }
        /* Forzar SIEMPRE 4 líneas de altura */
        .line-clamp-4-exact {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5rem; 
            min-height: 6rem; 
        }
        
        /* Estilos selectores nativos */
        .filtro-estilizado {
            background-color: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-estilizado::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        /* Animación suave para la cajita de diálogo */
        @keyframes fadeUp {
            from { transform: translate(-50%, -40%); opacity: 0; }
            to { transform: translate(-50%, -50%); opacity: 1; }
        }
        .animate-fade-up {
            animation: fadeUp 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 antialiased pb-12">

    <header class="bg-white/95 backdrop-blur-md border-b-4 border-lm-green sticky top-0 z-50 shadow-sm px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Boletín Noticias</h1>
                <p class="text-sm text-gray-500 font-medium">Leroy Merlin</p>
            </div>
            
            <div class="flex flex-wrap justify-center items-center gap-3">
                <div class="relative">
                    <select id="filtro-categoria" class="border border-lm-green text-lm-dark font-semibold px-5 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none filtro-estilizado pr-8 bg-transparent">
                        <option value="">Todas las categorías</option>
                        </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-lm-dark">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <input 
                    type="text" 
                    id="filtro-fecha" 
                    placeholder="Filtrar por fecha" 
                    onfocus="(this.type='date')" 
                    onblur="if(!this.value) this.type='text'" 
                    class="border border-lm-green text-lm-dark font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none bg-transparent text-center min-w-[150px] cursor-pointer" 
                    title="Filtrar por fecha"
                >
                
                <button id="btn-limpiar" class="hidden border border-gray-300 text-gray-500 font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-gray-100 transition-colors focus:outline-none">
                    Limpiar ✕
                </button>
            </div>
        </div>
    </header>

    <main id="contenedor-boletines" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    </main>

    <div id="truth-avatar" class="fixed cursor-pointer z-[1000] hover:scale-110 transition-all duration-1000 ease-in-out" style="bottom: 20px; right: 20px;" title="¡Atrápame si puedes!">
        <img src="archivos/imagen23M.png" alt="Richie IA" class="w-16 h-16 object-contain drop-shadow-lg">
    </div>

    <div id="truth-message" class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white border-t-4 border-lm-green p-5 rounded-xl shadow-2xl z-[2000] w-[280px] animate-fade-up">
        
        <div id="truth-question-view">
            <p class="text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                <span class="text-xl">🤖</span> ¡Me atrapaste!
            </p>
            <p class="text-xs text-gray-600 font-medium leading-relaxed mb-4">
                Soy <strong>Richie</strong>, el asistente IA de Leroy Merlin. ¿Me inyectas el suero de la verdad para que te cuente un secreto?
            </p>
            <div class="flex gap-2">
                <button id="btn-yes-truth" class="flex-1 bg-lm-green text-white text-xs font-bold py-2 rounded hover:bg-lm-dark transition shadow-sm">💉 ¡Sí!</button>
                <button id="btn-no-truth" class="flex-1 bg-gray-100 text-gray-600 text-xs font-bold py-2 rounded hover:bg-gray-200 transition shadow-sm">Ahora no</button>
            </div>
        </div>

        <div id="truth-fact-view" class="hidden">
            <p class="text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
                <span class="text-xl">🧪</span> Suero inyectado
            </p>
            <p id="truth-text" class="text-xs text-gray-600 font-medium leading-relaxed"></p>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. CARGA DE NOTICIAS (DATA.JSON)
        // ==========================================
        const CARPETA_ASSETS = "./archivos/";
        let EDICIONES_DEL_BOLETIN = []; 

        const contenedor = document.getElementById('contenedor-boletines');
        const selectCategoria = document.getElementById('filtro-categoria');
        const inputFecha = document.getElementById('filtro-fecha');
        const btnLimpiar = document.getElementById('btn-limpiar');

        async function cargarDatos() {
            try {
                const respuesta = await fetch('./data.json?t=' + new Date().getTime());
                if (!respuesta.ok) throw new Error('No se pudo cargar el archivo data.json');
                EDICIONES_DEL_BOLETIN = await respuesta.json();
                inicializarCategorias();
                renderizarNoticias();
            } catch (error) {
                console.error("Error cargando noticias:", error);
                contenedor.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">Error cargando las noticias. Comprueba que el archivo data.json existe.</div>`;
            }
        }

        function inicializarCategorias() {
            const todasLasCategorias = EDICIONES_DEL_BOLETIN.flatMap(edicion => 
                (edicion.noticias || []).map(noticia => noticia.categoria)
            );
            const categoriasUnicas = [...new Set(todasLasCategorias)].sort();
            categoriasUnicas.forEach(cat => {
                if(!cat) return; 
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                selectCategoria.appendChild(option);
            });
        }

        function renderizarNoticias() {
            const categoriaSeleccionada = selectCategoria.value;
            const fechaSeleccionada = inputFecha.type === 'date' ? inputFecha.value : '';
            let htmlFinal = '';
            let edicionesVisibles = 0;

            EDICIONES_DEL_BOLETIN.forEach((edicion) => {
                const noticiasFiltradas = (edicion.noticias || []).filter(noticia => {
                    if (noticia.visible === false) return false;
                    const cumpleCategoria = categoriaSeleccionada === "" || noticia.categoria === categoriaSeleccionada;
                    const cumpleFecha = fechaSeleccionada === "" || noticia.fechaISO === fechaSeleccionada;
                    return cumpleCategoria && cumpleFecha;
                });

                const mostrarBanner = edicion.bannerLanding && (categoriaSeleccionada === "" && fechaSeleccionada === "");
                if (noticiasFiltradas.length === 0 && !mostrarBanner) return;

                const esLaMasNueva = edicionesVisibles === 0;
                const opacidad = esLaMasNueva ? '' : 'opacity-80';

                if (!esLaMasNueva && edicionesVisibles > 0) {
                    htmlFinal += `
                    <div class="flex items-center justify-center mt-20 mb-14">
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                        <span class="px-5 text-lm-dark text-sm font-bold uppercase tracking-widest whitespace-nowrap bg-[#f4f6f8]">Noticias Anteriores</span>
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                    </div>`;
                }

                let tarjetasNoticias = '';

                if (mostrarBanner) {
                    const banner = edicion.bannerLanding;
                    let rutaImagenBanner = banner.imagen;
                    if (!rutaImagenBanner.startsWith('http') && !rutaImagenBanner.startsWith('./')) {
                        rutaImagenBanner = CARPETA_ASSETS + banner.imagen;
                    }
                    tarjetasNoticias += `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 mb-6">
                        <a href="${banner.enlace}" target="_blank" class="block relative w-full h-[300px] md:h-[400px] rounded-2xl overflow-hidden shadow-md group">
                            <img src="${rutaImagenBanner}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/1200x400/e2e8f0/64748b?text=Banner+Leroy+Merlin'">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/30 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 p-6 md:p-10 w-full flex flex-col items-start">
                                <span class="bg-lm-green text-white text-[10px] md:text-xs font-bold px-3 py-1 rounded shadow-sm uppercase mb-3">Especial Temático</span>
                                <h3 class="text-2xl md:text-4xl font-bold text-white mb-5 drop-shadow-md">${banner.titulo}</h3>
                                <span class="inline-flex items-center text-sm font-bold text-gray-900 bg-white hover:bg-lm-green hover:text-white px-5 py-2.5 rounded-full transition-all group-hover:px-6 shadow-lg">
                                    Leer el informe completo →
                                </span>
                            </div>
                        </a>
                    </div>`;
                }

                noticiasFiltradas.forEach(noticia => {
                    let htmlMultimedia = '';
                    if (noticia.video) {
                        const rutaVideo = noticia.video.startsWith('http') ? noticia.video : CARPETA_ASSETS + noticia.video;
                        htmlMultimedia = `<video controls class="w-full h-full object-cover"><source src="${rutaVideo}" type="video/mp4"></video>`;
                    } else {
                        let imagenSrc = noticia.imagen && noticia.imagen.trim() !== "" ? noticia.imagen : 'https://placehold.co/600x400/e2e8f0/64748b?text=Leroy+Merlin';
                        if (!imagenSrc.startsWith('http') && !imagenSrc.includes('.')) imagenSrc = CARPETA_ASSETS + imagenSrc + '.png';
                        htmlMultimedia = `<img src="${imagenSrc}" alt="${noticia.titulo}" loading="lazy" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Cargando...'">`;
                    }

                    tarjetasNoticias += `
                    <article class="tarjeta-noticia bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                        <div class="contenedor-imagen ${esLaMasNueva ? '' : 'opacity-90'} relative">
                            ${htmlMultimedia}
                            <span class="absolute top-3 left-3 bg-white/90 text-lm-dark text-xs font-bold px-2.5 py-1 rounded shadow uppercase tracking-wide">${noticia.categoria}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex justify-end mb-3">
                                <span class="text-gray-400 text-xs font-semibold flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${noticia.fechaTexto}
                                </span>
                            </div>
                            <h3 class="font-bold text-xl mb-3 leading-snug text-gray-900 line-clamp-2" title="${noticia.titulo}">${noticia.titulo}</h3>
                            <p class="text-gray-600 text-sm mb-6 flex-grow line-clamp-4-exact">${noticia.resumen}</p>
                            <a href="${noticia.enlace}" target="_blank" class="text-sm font-bold text-lm-dark hover:text-lm-green transition-colors mt-auto inline-flex items-center group">
                                Leer noticia completa <span class="ml-1.5 group-hover:translate-x-1 transition-transform">→</span>
                            </a>
                        </div>
                    </article>`;
                });

                htmlFinal += `
                <section class="mb-16 ${opacidad} transition-all duration-300">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 w-full max-w-4xl mx-auto flex flex-col items-center">
                        <h2 class="text-center font-bold ${esLaMasNueva ? 'text-xl text-lm-dark' : 'text-lg text-gray-500'} ${edicion.audioSrc ? 'mb-4' : 'mb-0'}">${edicion.tituloAudio}</h2>
                        ${edicion.audioSrc ? `<audio controls class="w-full max-w-2xl audio-boletin bg-gray-50 rounded-lg shadow-inner"><source src="${CARPETA_ASSETS}${edicion.audioSrc}"></audio>` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">${tarjetasNoticias}</div>
                </section>`;
                edicionesVisibles++;
            });

            if (edicionesVisibles === 0) {
                htmlFinal = `<div class="text-center py-20"><p class="text-gray-500 text-lg mb-4">No hay noticias que coincidan con los filtros seleccionados.</p></div>`;
            }

            contenedor.innerHTML = htmlFinal;
            (categoriaSeleccionada || fechaSeleccionada) ? btnLimpiar.classList.remove('hidden') : btnLimpiar.classList.add('hidden');
        }

        selectCategoria.addEventListener('change', renderizarNoticias);
        inputFecha.addEventListener('change', renderizarNoticias);
        btnLimpiar.addEventListener('click', () => { selectCategoria.value = ''; inputFecha.value = ''; inputFecha.type = 'text'; renderizarNoticias(); });
        
        document.addEventListener('play', function(e){
            var audios = document.getElementsByTagName('audio');
            for(var i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target) audios[i].pause();
            }
        }, true);

        // Arrancar la carga JSON
        cargarDatos();


        // ==========================================
        // 2. LÓGICA DE RICHIE MOVIL (ATRÁPAME)
        // ==========================================
        
        const verdadesReveladas = [
            "Dato #1: El término 'Agentic Commerce' significa que tu IA podrá negociar y comprar por ti un destornillador si detecta que el tuyo está roto.",
            "Dato #2: Gemini procesa la información en tokens. En Leroy Merlin, estamos usando tokens de marca nativos para asegurar coherencia visual.",
            "Dato #3: Midjourney V8Alpha no solo es rápido, ¡aprende de tus selecciones previas para mejorar las sugerencias de diseño!",
            "Dato #4: El SEO Generativo (GEO) prioriza respuestas directas sobre enlaces. Optimizamos para ser LA RESPUESTA.",
            "Dato #5: ¡Has descubierto un huevo de pascua digital! El 60% de los usuarios prefieren usar el buscador antes que el menú.",
            "Dato #6: La primera tienda de Leroy Merlin en España se abrió en 1989 en Leganés, ¡mucho antes de que existiera la IA!",
            "Dato #7: La Inteligencia Artificial ya nos ayuda a predecir picos de demanda en productos de jardín semanas antes de la primavera.",
            "Dato #8: Un buen diseño UX no es solo estético; un retraso de 1 segundo en la carga móvil puede hacer caer las conversiones hasta un 20%.",
            "Dato #9: Históricamente, el término más buscado en Leroy Merlin durante la primavera suele ser 'Césped artificial'.",
            "Dato #10: Más del 70% de los proyectos de mejora del hogar comienzan con una búsqueda online. ¡Por eso el SEO es clave!",
            "Dato #11: Las herramientas de IA Generativa pueden reducir el tiempo de creación de prototipos de interfaces hasta en un 40%.",
            "Dato #12: Los 'Retailers' están acelerando su inversión en IA no solo para vender más, sino para ofrecer recomendaciones hiper-personalizadas."
        ];

        const avatar = document.getElementById('truth-avatar');
        const messageBox = document.getElementById('truth-message');
        const questionView = document.getElementById('truth-question-view');
        const factView = document.getElementById('truth-fact-view');
        const btnYes = document.getElementById('btn-yes-truth');
        const btnNo = document.getElementById('btn-no-truth');
        const truthText = document.getElementById('truth-text');

        let intervaloMovimiento;
        let timeoutOcultar; 

        // Función para mover al robot aleatoriamente
        function moverRichie() {
            // Restamos 100px para que no se salga por los bordes y haya margen
            const anchoDisponible = window.innerWidth - 100; 
            const altoDisponible = window.innerHeight - 100;
            
            const randomTop = Math.floor(Math.random() * altoDisponible);
            const randomLeft = Math.floor(Math.random() * anchoDisponible);
            
            // Quitamos las clases iniciales de "abajo-derecha" y le damos las nuevas coordenadas
            avatar.style.bottom = "auto";
            avatar.style.right = "auto";
            avatar.style.top = Math.max(20, randomTop) + "px";
            avatar.style.left = Math.max(20, randomLeft) + "px";
        }

        // Arrancar el movimiento (Bucle)
        function iniciarJuego() {
            avatar.style.display = 'block'; // Aseguramos que es visible
            // Se mueve cada 2500ms (2.5 segundos)
            intervaloMovimiento = setInterval(moverRichie, 2500);
        }

        if (avatar) {
            // Arrancamos el minijuego a los 3 segundos de entrar en la web
            setTimeout(iniciarJuego, 3000);

            // 1. Clic en Richie flotante (LO ATRAPASTE)
            avatar.addEventListener('click', () => {
                clearInterval(intervaloMovimiento); // ¡Detenemos el movimiento!
                clearTimeout(timeoutOcultar); // Limpiamos temporizadores antiguos
                
                avatar.style.display = 'none'; // Ocultamos a Richie
                
                // Preparamos y mostramos el modal centrado
                questionView.classList.remove('hidden');
                factView.classList.add('hidden');
                messageBox.classList.remove('hidden'); 
            });

            // 2. Clic en el botón verde "Sí"
            btnYes.addEventListener('click', () => {
                const datoAleatorio = verdadesReveladas[Math.floor(Math.random() * verdadesReveladas.length)];
                truthText.textContent = datoAleatorio;
                
                questionView.classList.add('hidden');
                factView.classList.remove('hidden');

                // Tras leer el dato (8 segundos), desaparece el modal y vuelve a huir
                timeoutOcultar = setTimeout(() => {
                    messageBox.classList.add('hidden');
                    iniciarJuego(); 
                }, 8000); 
            });

            // 3. Clic en el botón gris "Ahora no"
            btnNo.addEventListener('click', () => {
                messageBox.classList.add('hidden'); // Ocultar diálogo
                iniciarJuego(); // Vuelve a escapar inmediatamente
            });
        }
    </script>
</body>
</html>
