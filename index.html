<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletín Noticias - Leroy Merlin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lm-green': '#6cc24a',
                        'lm-dark': '#5aa33e',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Efecto al pasar el ratón por encima de la noticia */
        .tarjeta-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%; /* Asegura que todas las tarjetas de una fila midan lo mismo */
        }
        .tarjeta-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.15);
        }
        .contenedor-imagen {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .contenedor-imagen img, .contenedor-imagen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            outline: none;
        }
        /* Nueva clase para forzar SIEMPRE 4 líneas de altura */
        .line-clamp-4-exact {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5rem; /* Altura de cada línea */
            min-height: 6rem; /* 1.5rem x 4 líneas = 6rem exactos siempre */
        }
        
        /* Estilos extra para embellecer los selectores nativos */
        .filtro-estilizado {
            background-color: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-estilizado::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        /* ========================================= */
        /* ESTILOS DEL MINIJUEGO "ATRAPA EL ROBOT"   */
        /* ========================================= */
        #moving-avatar {
            position: fixed; 
            width: 45px;
            height: 45px;
            background-color: white; 
            border: 3px solid #6cc24a; /* Verde Leroy */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            cursor: pointer;
            z-index: 10000; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            /* El movimiento es suave */
            transition: top 1s ease-in-out, left 1s ease-in-out, transform 0.2s ease;
        }

        #moving-avatar:hover {
            transform: scale(1.15); 
            border-color: #ff6600; /* Naranja para dar feedback visual */
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 20000;
        }

        .modal-content.truth-theme {
            background: white;
            padding: 30px;
            border-radius: 16px;
            border-top: 8px solid #9333ea; /* Púrpura "Suero de la Verdad" */
            max-width: 400px; 
            text-align: center;
            position: relative;
            animation: dropSerum 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .serum-icon {
            font-size: 55px; margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(147, 51, 234, 0.4));
        }

        .close-btn {
            position: absolute; top: 10px; right: 15px;
            cursor: pointer; font-size: 28px; color: #9ca3af;
            line-height: 1;
        }
        
        .close-btn:hover { color: #374151; }

        @keyframes dropSerum {
            from { transform: translateY(-50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-gray-800 antialiased pb-12">

    <header class="bg-white/95 backdrop-blur-md border-b-4 border-lm-green sticky top-0 z-50 shadow-sm px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Boletín Noticias</h1>
                <p class="text-sm text-gray-500 font-medium">Leroy Merlin</p>
            </div>
            
            <div class="flex flex-wrap justify-center items-center gap-3">
                <div class="relative">
                    <select id="filtro-categoria" class="border border-lm-green text-lm-dark font-semibold px-5 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none filtro-estilizado pr-8 bg-transparent">
                        <option value="">Todas las categorías</option>
                        </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-lm-dark">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <input 
                    type="text" 
                    id="filtro-fecha" 
                    placeholder="Filtrar por fecha" 
                    onfocus="(this.type='date')" 
                    onblur="if(!this.value) this.type='text'" 
                    class="border border-lm-green text-lm-dark font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none bg-transparent text-center min-w-[150px] cursor-pointer" 
                    title="Filtrar por fecha"
                >
                
                <button id="btn-limpiar" class="hidden border border-gray-300 text-gray-500 font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-gray-100 transition-colors focus:outline-none">
                    Limpiar ✕
                </button>
            </div>
        </div>
    </header>

    <main id="contenedor-boletines" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    </main>

    <div id="moving-avatar" title="¡Atrápame si puedes!">🤖</div>
    
    <div id="truth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content truth-theme">
            <span id="close-truth-modal" class="close-btn">&times;</span>
            <div class="serum-icon">🧪</div>
            <h3 class="text-xl font-bold text-gray-900 mb-4">Suero de la verdad inyectado</h3>
            <p id="truth-text" class="text-gray-600 font-medium">Cargando dato revelado...</p>
        </div>
    </div>

    <script>
        // CARPETA BASE PARA TUS FOTOS Y VÍDEOS
        const CARPETA_ASSETS = "./archivos/";
        
        // Ahora es un array vacío, los datos se llenarán desde data.json
        let EDICIONES_DEL_BOLETIN = []; 

        const contenedor = document.getElementById('contenedor-boletines');
        const selectCategoria = document.getElementById('filtro-categoria');
        const inputFecha = document.getElementById('filtro-fecha');
        const btnLimpiar = document.getElementById('btn-limpiar');

        // Función para cargar el JSON de manera asíncrona
        async function cargarDatos() {
            try {
                const respuesta = await fetch('./data.json?t=' + new Date().getTime());
                if (!respuesta.ok) throw new Error('No se pudo cargar el archivo data.json');
                
                EDICIONES_DEL_BOLETIN = await respuesta.json();
                
                inicializarCategorias();
                renderizarNoticias();
            } catch (error) {
                console.error("Error al cargar las noticias:", error);
                contenedor.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">Error cargando las noticias. Comprueba que el archivo data.json existe en la raíz de tu repositorio.</div>`;
            }
        }

        function inicializarCategorias() {
            // Extraer categorías asegurándonos de que si noticias no existe o está vacío, no falle
            const todasLasCategorias = EDICIONES_DEL_BOLETIN.flatMap(edicion => 
                (edicion.noticias || []).map(noticia => noticia.categoria)
            );
            const categoriasUnicas = [...new Set(todasLasCategorias)].sort();
            
            categoriasUnicas.forEach(cat => {
                if(!cat) return; // Evitar categorías vacías
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                selectCategoria.appendChild(option);
            });
        }

        function renderizarNoticias() {
            const categoriaSeleccionada = selectCategoria.value;
            const fechaSeleccionada = inputFecha.type === 'date' ? inputFecha.value : '';
            let htmlFinal = '';
            let edicionesVisibles = 0;

            EDICIONES_DEL_BOLETIN.forEach((edicion) => {
                // Filtrar noticias normales si las hay
                const noticiasFiltradas = (edicion.noticias || []).filter(noticia => {
                    // MENTOR DEV: Aquí está la magia. Si la noticia tiene visible en false, la ignoramos.
                    if (noticia.visible === false) return false;

                    const cumpleCategoria = categoriaSeleccionada === "" || noticia.categoria === categoriaSeleccionada;
                    const cumpleFecha = fechaSeleccionada === "" || noticia.fechaISO === fechaSeleccionada;
                    return cumpleCategoria && cumpleFecha;
                });

                // Determinar si mostramos el Banner Especial (solo si no hay filtros activos)
                const mostrarBanner = edicion.bannerLanding && (categoriaSeleccionada === "" && fechaSeleccionada === "");

                // Si no hay noticias tras el filtro Y no hay banner que mostrar, saltamos a la siguiente edición
                if (noticiasFiltradas.length === 0 && !mostrarBanner) return;

                const esLaMasNueva = edicionesVisibles === 0;
                const opacidad = esLaMasNueva ? '' : 'opacity-80';

                // Añadir la línea separadora si no es la edición más nueva
                if (!esLaMasNueva && edicionesVisibles > 0) {
                    htmlFinal += `
                    <div class="flex items-center justify-center mt-20 mb-14">
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                        <span class="px-5 text-lm-dark text-sm font-bold uppercase tracking-widest whitespace-nowrap bg-[#f4f6f8]">
                            Noticias Anteriores
                        </span>
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                    </div>`;
                }

                let tarjetasNoticias = '';

                // --- RENDERIZADO DEL BANNER DE LANDING PAGE ---
                if (mostrarBanner) {
                    const banner = edicion.bannerLanding;
                    let rutaImagenBanner = banner.imagen;
                    
                    if (!rutaImagenBanner.startsWith('http') && !rutaImagenBanner.startsWith('./')) {
                        rutaImagenBanner = CARPETA_ASSETS + banner.imagen;
                    }
                    
                    tarjetasNoticias += `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 mb-6">
                        <a href="${banner.enlace}" target="_blank" rel="noopener noreferrer" class="block relative w-full h-[300px] md:h-[400px] rounded-2xl overflow-hidden shadow-md border border-gray-200 group">
                            <img src="${rutaImagenBanner}" alt="${banner.titulo}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/1200x400/e2e8f0/64748b?text=Banner+Leroy+Merlin'">
                            
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/30 to-transparent"></div>
                            
                            <div class="absolute bottom-0 left-0 p-6 md:p-10 w-full flex flex-col items-start">
                                <span class="bg-lm-green text-white text-[10px] md:text-xs font-bold px-3 py-1 rounded shadow-sm uppercase tracking-wider mb-3">
                                    Especial Temático
                                </span>
                                <h3 class="text-2xl md:text-4xl font-bold text-white mb-5 leading-tight drop-shadow-md">
                                    ${banner.titulo}
                                </h3>
                                
                                <span class="inline-flex items-center text-sm font-bold text-gray-900 bg-white hover:bg-lm-green hover:text-white px-5 py-2.5 rounded-full transition-all group-hover:px-6 shadow-lg">
                                    Leer el informe completo 
                                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                                </span>
                            </div>
                        </a>
                    </div>
                    `;
                }

                // Renderizado normal de tarjetas
                noticiasFiltradas.forEach(noticia => {
                    let htmlMultimedia = '';
                    
                    if (noticia.video) {
                        const rutaVideo = noticia.video.startsWith('http') ? noticia.video : CARPETA_ASSETS + noticia.video;
                        htmlMultimedia = `
                        <video controls preload="metadata" class="w-full h-full object-cover">
                            <source src="${rutaVideo}" type="video/mp4">
                            Tu navegador no soporta vídeos.
                        </video>`;
                    } else {
                        let imagenSrc = noticia.imagen && noticia.imagen.trim() !== "" 
                            ? noticia.imagen 
                            : 'https://placehold.co/600x400/e2e8f0/64748b?text=Leroy+Merlin';
                            
                        if (!imagenSrc.startsWith('http') && !imagenSrc.includes('.')) {
                            // MENTOR DEV: Ahora tu web asume que las imágenes sin extensión son .png (ideal para iPad)
                            imagenSrc = CARPETA_ASSETS + imagenSrc + '.png';
                        }

                        htmlMultimedia = `<img src="${imagenSrc}" alt="${noticia.titulo}" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Subiendo+Imagen...'">`;
                    }

                    tarjetasNoticias += `
                    <article class="tarjeta-noticia bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                        <div class="contenedor-imagen ${esLaMasNueva ? '' : 'opacity-90'} relative">
                            ${htmlMultimedia}
                            <span class="absolute top-3 left-3 bg-white/90 text-lm-dark text-xs font-bold px-2.5 py-1 rounded shadow uppercase tracking-wide">
                                ${noticia.categoria}
                            </span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex justify-end mb-3">
                                <span class="text-gray-400 text-xs font-semibold flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${noticia.fechaTexto}
                                </span>
                            </div>
                            <h3 class="font-bold text-xl mb-3 leading-snug text-gray-900 line-clamp-2" title="${noticia.titulo}">${noticia.titulo}</h3>
                            <p class="text-gray-600 text-sm mb-6 flex-grow line-clamp-4-exact">${noticia.resumen}</p>
                            
                            <a href="${noticia.enlace}" target="_blank" class="text-sm font-bold text-lm-dark hover:text-lm-green transition-colors mt-auto inline-flex items-center group">
                                Leer noticia completa 
                                <span class="ml-1.5 group-hover:translate-x-1 transition-transform">→</span>
                            </a>
                        </div>
                    </article>`;
                });

                htmlFinal += `
                <section class="mb-16 ${opacidad} transition-all duration-300">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 w-full max-w-4xl mx-auto flex flex-col items-center">
                        <h2 class="text-center font-bold ${esLaMasNueva ? 'text-xl text-lm-dark' : 'text-lg text-gray-500'} ${edicion.audioSrc ? 'mb-4' : 'mb-0'}">${edicion.tituloAudio}</h2>
                        ${edicion.audioSrc ? `
                        <audio controls class="w-full max-w-2xl audio-boletin bg-gray-50 rounded-lg shadow-inner">
                            <source src="${CARPETA_ASSETS}${edicion.audioSrc}">
                            Tu navegador no soporta el audio.
                        </audio>
                        ` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">
                        ${tarjetasNoticias}
                    </div>
                </section>`;

                edicionesVisibles++;
            });

            if (edicionesVisibles === 0) {
                htmlFinal = `
                <div class="text-center py-20">
                    <p class="text-gray-500 text-lg mb-4">No hay noticias que coincidan con los filtros seleccionados.</p>
                </div>`;
            }

            contenedor.innerHTML = htmlFinal;

            if (categoriaSeleccionada || fechaSeleccionada) {
                btnLimpiar.classList.remove('hidden');
            } else {
                btnLimpiar.classList.add('hidden');
            }
        }

        selectCategoria.addEventListener('change', renderizarNoticias);
        inputFecha.addEventListener('change', renderizarNoticias);
        
        btnLimpiar.addEventListener('click', () => {
            selectCategoria.value = '';
            inputFecha.value = '';
            inputFecha.type = 'text'; 
            renderizarNoticias();
        });

        document.addEventListener('play', function(e){
            var audios = document.getElementsByTagName('audio');
            for(var i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target){
                    audios[i].pause();
                }
            }
        }, true);

        // Llamamos a la función que carga los datos de las noticias
        cargarDatos();

        // =========================================================================
        // LÓGICA DEL MINIJUEGO: "ATRAPA AL ROBOT"
        // =========================================================================
        
        const verdadesReveladas = [
            "Dato #1: El término 'Agentic Commerce' significa que tu IA podrá negociar y comprar por ti un destornillador si detecta que el tuyo está roto.",
            "Dato #2: Gemini procesa la información en tokens. En Leroy Merlin, estamos usando tokens de marca nativos para asegurar coherencia visual.",
            "Dato #3: Midjourney V8Alpha no solo es rápido, ¡aprende de tus selecciones previas para mejorar las sugerencias de diseño!",
            "Dato #4: El SEO Generativo (GEO) prioriza respuestas directas sobre enlaces. Optimizamos para ser LA RESPUESTA.",
            "Dato #5: ¡Has descubierto un huevo de pascua digital! El 60% de los usuarios prefieren usar el buscador antes que el menú.",
            "Dato #6: La primera tienda de Leroy Merlin en España se abrió en 1989 en Leganés, ¡mucho antes de que existiera la IA!",
            "Dato #7: La Inteligencia Artificial ya nos ayuda a predecir picos de demanda en productos de jardín semanas antes de la primavera.",
            "Dato #8: Un buen diseño UX no es solo estético; un retraso de 1 segundo en la carga móvil puede hacer caer las conversiones hasta un 20%.",
            "Dato #9: Históricamente, el término más buscado en Leroy Merlin durante la primavera suele ser 'Césped artificial'.",
            "Dato #10: Más del 70% de los proyectos de mejora del hogar comienzan con una búsqueda online. ¡Por eso el SEO es clave!",
            "Dato #11: Las herramientas de IA Generativa pueden reducir el tiempo de creación de prototipos de interfaces hasta en un 40%.",
            "Dato #12: Los 'Retailers' están acelerando su inversión en IA no solo para vender más, sino para ofrecer recomendaciones hiper-personalizadas."
        ];

        const avatar = document.getElementById('moving-avatar');
        const modalVerdad = document.getElementById('truth-modal');
        const btnCerrarVerdad = document.getElementById('close-truth-modal');
        const textoVerdad = document.getElementById('truth-text');

        let intervaloMovimiento; 
        let robotAtrapado = false; 

        function obtenerPosicionAleatoria() {
            // Restamos 60px para asegurarnos de que el robot no se salga de la pantalla
            const anchoDisponible = window.innerWidth - 60; 
            const altoDisponible = window.innerHeight - 60;
            
            const randomTop = Math.floor(Math.random() * altoDisponible);
            const randomLeft = Math.floor(Math.random() * anchoDisponible);
            
            return { top: randomTop, left: randomLeft };
        }

        function moverRobot() {
            if (robotAtrapado) return; 
            const pos = obtenerPosicionAleatoria();
            avatar.style.top = pos.top + "px";
            avatar.style.left = pos.left + "px";
        }

        function iniciarJuegoRobot() {
            robotAtrapado = false;
            avatar.style.display = 'flex'; // Asegurar que esté visible
            moverRobot(); 
            // Se mueve cada 2.5 segundos (2500 ms) - Puedes ajustarlo si es muy rápido o muy lento
            intervaloMovimiento = setInterval(moverRobot, 2500); 
        }

        // Al atraparlo...
        avatar.addEventListener('click', () => {
            robotAtrapado = true; 
            clearInterval(intervaloMovimiento); 
            
            // Elegir verdad al azar
            const randomFact = verdadesReveladas[Math.floor(Math.random() * verdadesReveladas.length)];
            textoVerdad.textContent = randomFact;
            
            modalVerdad.style.display = 'flex';
            
            // Ocultamos el robot temporalmente mientras lee
            avatar.style.display = 'none'; 
        });

        // Al cerrar el modal
        btnCerrarVerdad.addEventListener('click', () => {
            modalVerdad.style.display = 'none';
            // Volvemos a iniciar el juego por si quiere atraparlo de nuevo
            iniciarJuegoRobot();
        });

        // Ocultar modal al hacer clic en el fondo negro
        window.addEventListener('click', (event) => {
            if (event.target === modalVerdad) {
                modalVerdad.style.display = 'none';
                iniciarJuegoRobot();
            }
        });

        // Arrancamos el minijuego en cuanto cargue la web
        iniciarJuegoRobot();

    </script>
</body>
</html>
