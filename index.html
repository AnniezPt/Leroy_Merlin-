    <script>
        tailwind.config = {
            theme: {

    <style>
        body {
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
        }
        .tarjeta-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .tarjeta-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.15);
        }
        .contenedor-imagen {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .contenedor-imagen img, .contenedor-imagen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            outline: none;
        }
        .line-clamp-6-exact {
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5rem; 
            min-height: 9rem; 
        }
        .filtro-estilizado {
            background-color: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-estilizado::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        @keyframes popUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-pop-up {
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .latido-suave {
            animation: latido 3s ease-in-out infinite;
        }
    </style>

    <!-- INICIO ONESIGNAL -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "a911aeb6-7ef9-41d3-9b76-6a5b3dfa9df2",
          notifyButton: {
            enable: true,
            size: 'medium',
            theme: 'default',
            position: 'bottom-left',
            text: {
                'tip.state.unsubscribed': '¡Suscríbete a las alertas!',
                'tip.state.subscribed': 'Estás suscrito a los avisos',
                'tip.state.blocked': 'Has bloqueado las notificaciones',
                'message.prenotify': 'Haz clic para recibir avisos cuando suba noticias nuevas',
                'message.action.subscribed': '¡Gracias por suscribirte!',
                'message.action.resubscribed': '¡Estás suscrito de nuevo!',
                'message.action.unsubscribed': 'Ya no recibirás avisos',
                'dialog.main.title': 'Notificaciones del Boletín',
                'dialog.main.button.subscribe': 'SUSCRIBIRME',
                'dialog.main.button.unsubscribe': 'DARME DE BAJA',
            }
          }
        });
        
        // Magia anti-Apple: Forzamos el cartel nativo grande por si no sale la campana
        OneSignal.showSlidedownPrompt();
      });
    </script>
    <!-- FIN ONESIGNAL -->

</head>
<body class="text-gray-800 antialiased pb-12 relative">

    <header class="bg-white/95 backdrop-blur-md border-b-4 border-lm-green sticky top-0 z-50 shadow-sm px-6 py-4">

            <div class="flex flex-wrap justify-center items-center gap-3">
                
                <!-- NUEVO BOTÓN MANUAL DE NOTIFICACIONES -->
                <button id="btn-suscribir-push" class="flex items-center gap-2 border border-blue-500 text-blue-600 font-bold px-4 py-1.5 rounded-full text-sm hover:bg-blue-50 transition-colors focus:outline-none bg-white shadow-sm" title="Activar notificaciones">

                <div class="relative">

    <script>
        // Lógica del nuevo botón "Avisos" para OneSignal (VERSIÓN FORZADA PARA APPLE)
        document.getElementById('btn-suscribir-push').addEventListener('click', async () => {
            if (window.OneSignalDeferred) {
                window.OneSignalDeferred.push(async function(OneSignal) {
                    try {
                        // 1. Primero comprobamos si el navegador soporta notificaciones o si las está bloqueando por defecto
                        const isPushSupported = OneSignal.Notifications.isPushSupported();
                        
                        if (!isPushSupported) {
                            alert("⚠️ Tu dispositivo o navegador está bloqueando las notificaciones.\n\nSi usas iPad o iPhone:\n1. Toca el botón de Compartir (arriba a la derecha).\n2. Dale a 'Añadir a la pantalla de inicio'.\n3. Abre el Boletín desde el icono nuevo y vuelve a pulsar este botón.\n\n(Asegúrate de NO estar en modo incógnito).");
                            return;
                        }

                        // 2. Comprobamos el permiso actual
                        const permission = await OneSignal.Notifications.permission;
                        
                        if (permission === 'granted') {
                            alert("✅ ¡Ya estás suscrito! Te avisaremos cuando haya novedades.");
                        } else if (permission === 'denied') {
                            alert("❌ Tienes las notificaciones bloqueadas. Ve a los Ajustes de tu navegador y permite las notificaciones para esta página.");
                        } else {
                            // 3. Forzamos el prompt nativo del navegador
                            await OneSignal.Notifications.requestPermission();
                        }
                    } catch (error) {
                        console.error("Error al intentar suscribir:", error);
                        // Fallback de emergencia
                        OneSignal.showSlidedownPrompt({ force: true });
                    }
                });
            } else {
                 alert("⏳ El sistema de notificaciones aún se está cargando. Espera un segundo y vuelve a intentarlo.");
            }
        });

        // ==========================================
        // 1. LÓGICA DE NOTICIAS Y RASTREADOR
        // ==========================================
        const CARPETA_ASSETS = "./archivos/";
        let EDICIONES_DEL_BOLETIN = []; 
        let mostrarTodasAnteriores = false;

        const contenedor = document.getElementById('contenedor-boletines');
        const selectCategoria = document.getElementById('filtro-categoria');
        const inputFecha = document.getElementById('filtro-fecha');
        const btnLimpiar = document.getElementById('btn-limpiar');

        let scoreTechie = parseInt(localStorage.getItem('lm_score_techie')) || 0;
        let scoreBusiness = parseInt(localStorage.getItem('lm_score_business')) || 0;

        function actualizarPuntuacion(categoria) {
            if (!categoria) return;
            const cat = categoria.toUpperCase();
            if (cat.includes('IA') || cat.includes('TECH') || cat.includes('DATOS')) {
                scoreTechie++;
                localStorage.setItem('lm_score_techie', scoreTechie);
            } 
            else if (cat.includes('GEO') || cat.includes('RETAIL') || cat.includes('NEGOCIO') || cat.includes('MARKETING') || cat.includes('SEO')) {
                scoreBusiness++;
                localStorage.setItem('lm_score_business', scoreBusiness);
            }
        }

        async function cargarDatos() {
            try {
                const respuesta = await fetch('./data.json?t=' + new Date().getTime());
                if (!respuesta.ok) throw new Error('No se pudo cargar el archivo data.json');
                EDICIONES_DEL_BOLETIN = await respuesta.json();
                inicializarCategorias();
                renderizarNoticias();
            } catch (error) {
                console.error("Error cargando noticias:", error);
                contenedor.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">Error cargando las noticias. Comprueba que el archivo data.json existe.</div>`;
            }
        }

        function inicializarCategorias() {
            const todasLasCategorias = EDICIONES_DEL_BOLETIN.flatMap(edicion => 
                (edicion.noticias || []).map(noticia => noticia.categoria)
            );
            const categoriasUnicas = [...new Set(todasLasCategorias)].sort();
            categoriasUnicas.forEach(cat => {
                if(!cat) return; 
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                selectCategoria.appendChild(option);
            });
        }

        function renderizarNoticias() {
            const categoriaSeleccionada = selectCategoria.value;
            const fechaSeleccionada = inputFecha.type === 'date' ? inputFecha.value : '';
            const hayFiltros = (categoriaSeleccionada !== "" || fechaSeleccionada !== "");
            
            let htmlFinal = '';
            let edicionesVisibles = 0;
            let hayMasOcultas = false;

            // Calculamos hace exactamente una semana
            const haceUnaSemana = new Date();
            haceUnaSemana.setDate(haceUnaSemana.getDate() - 7);

            if (categoriaSeleccionada) actualizarPuntuacion(categoriaSeleccionada);

            EDICIONES_DEL_BOLETIN.forEach((edicion, indexEdicion) => {
                const noticiasFiltradas = (edicion.noticias || []).filter(noticia => {
                    if (noticia.visible === false) return false;
                    const cumpleCategoria = categoriaSeleccionada === "" || noticia.categoria === categoriaSeleccionada;
                    const cumpleFecha = fechaSeleccionada === "" || noticia.fechaISO === fechaSeleccionada;
                    return cumpleCategoria && cumpleFecha;
                });

                const mostrarBanner = edicion.bannerLanding && !hayFiltros;
                if (noticiasFiltradas.length === 0 && !mostrarBanner) return;

                // Verificar si la edición es reciente (menos de 7 días) o es la primera de la lista
                let esReciente = (indexEdicion === 0); 
                noticiasFiltradas.forEach(noticia => {
                    if (noticia.fechaISO) {
                        const fechaNoticia = new Date(noticia.fechaISO);
                        if (fechaNoticia >= haceUnaSemana) esReciente = true;
                    }
                });

                // Si no hay filtros, no hemos dado al botón de ver todo, y es antigua -> Ocultar
                if (!hayFiltros && !mostrarTodasAnteriores && !esReciente) {
                    hayMasOcultas = true;
                    return; 
                }

                const esLaMasNueva = edicionesVisibles === 0;
                const opacidad = esLaMasNueva ? '' : 'opacity-80';

                if (!esLaMasNueva && edicionesVisibles > 0) {
                    htmlFinal += `
                    <div class="flex items-center justify-center mt-20 mb-14">
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                        <span class="px-5 text-lm-dark text-sm font-bold uppercase tracking-widest whitespace-nowrap bg-[#f4f6f8]">Noticias Anteriores</span>
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                    </div>`;
                }

                let tarjetasNoticias = '';

                if (mostrarBanner) {
                    const banner = edicion.bannerLanding;
                    let rutaImagenBanner = banner.imagen;
                    if (!rutaImagenBanner.startsWith('http') && !rutaImagenBanner.startsWith('./')) {
                        rutaImagenBanner = CARPETA_ASSETS + banner.imagen;
                    }
                    tarjetasNoticias += `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 mb-6">
                        <a href="${banner.enlace}" target="_blank" data-categoria="Especial" class="link-noticia block relative w-full h-[300px] md:h-[400px] rounded-2xl overflow-hidden shadow-md group">
                            <img src="${rutaImagenBanner}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/1200x400/e2e8f0/64748b?text=Banner+Leroy+Merlin'">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/30 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 p-6 md:p-10 w-full flex flex-col items-start">
                                <span class="bg-lm-green text-white text-[10px] md:text-xs font-bold px-3 py-1 rounded shadow-sm uppercase mb-3">Especial Temático</span>
                                <h3 class="text-2xl md:text-4xl font-bold text-white mb-5 drop-shadow-md">${banner.titulo}</h3>
                                <span class="inline-flex items-center text-sm font-bold text-gray-900 bg-white hover:bg-lm-green hover:text-white px-5 py-2.5 rounded-full transition-all group-hover:px-6 shadow-lg">
                                    Leer el informe completo →
                                </span>
                            </div>
                        </a>
                    </div>`;
                }

                noticiasFiltradas.forEach(noticia => {
                    let htmlMultimedia = '';
                    if (noticia.video) {
                        const rutaVideo = noticia.video.startsWith('http') ? noticia.video : CARPETA_ASSETS + noticia.video;
                        htmlMultimedia = `<video controls class="w-full h-full object-cover"><source src="${rutaVideo}" type="video/mp4"></video>`;
                    } else {
                        let imagenSrc = noticia.imagen && noticia.imagen.trim() !== "" ? noticia.imagen : 'https://placehold.co/600x400/e2e8f0/64748b?text=Leroy+Merlin';
                        if (!imagenSrc.startsWith('http') && !imagenSrc.includes('.')) imagenSrc = CARPETA_ASSETS + imagenSrc + '.png';
                        htmlMultimedia = `<img src="${imagenSrc}" alt="${noticia.titulo}" loading="lazy" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Cargando...'">`;
                    }

                    tarjetasNoticias += `
                    <article class="tarjeta-noticia bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                        <div class="contenedor-imagen ${esLaMasNueva ? '' : 'opacity-90'} relative">
                            ${htmlMultimedia}
                            <span class="absolute top-3 left-3 bg-white/90 text-lm-dark text-xs font-bold px-2.5 py-1 rounded shadow uppercase tracking-wide">${noticia.categoria}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex justify-end mb-3">
                                <span class="text-gray-400 text-xs font-semibold flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${noticia.fechaTexto}
                                </span>
                            </div>
                            <h3 class="font-bold text-xl mb-3 leading-snug text-gray-900 line-clamp-2" title="${noticia.titulo}">${noticia.titulo}</h3>
                            <p class="text-gray-600 text-sm mb-6 flex-grow line-clamp-6-exact">${noticia.resumen}</p>
                            <a href="${noticia.enlace}" target="_blank" data-categoria="${noticia.categoria}" class="link-noticia text-sm font-bold text-lm-dark hover:text-lm-green transition-colors mt-auto inline-flex items-center group">
                                Leer noticia completa <span class="ml-1.5 group-hover:translate-x-1 transition-transform">→</span>
                            </a>
                        </div>
                    </article>`;
                });

                htmlFinal += `
                <section class="mb-16 ${opacidad} transition-all duration-300">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 w-full max-w-4xl mx-auto flex flex-col items-center">
                        <h2 class="text-center font-bold ${esLaMasNueva ? 'text-xl text-lm-dark' : 'text-lg text-gray-500'} ${edicion.audioSrc ? 'mb-4' : 'mb-0'}">${edicion.tituloAudio}</h2>
                        ${edicion.audioSrc ? `<audio controls class="w-full max-w-2xl audio-boletin bg-gray-50 rounded-lg shadow-inner"><source src="${CARPETA_ASSETS}${edicion.audioSrc}"></audio>` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">${tarjetasNoticias}</div>
                </section>`;
                edicionesVisibles++;
            });

            if (hayMasOcultas) {
                htmlFinal += `
                <div class="text-center mt-2 mb-16 animate-pop-up">
                    <button id="btn-ver-anteriores" class="bg-white border-2 border-lm-green text-lm-dark font-bold py-3 px-8 rounded-full hover:bg-lm-green hover:text-white transition-colors shadow-sm">
                        Ver boletines de semanas anteriores ⬇️
                    </button>
                </div>`;
            }

            if (edicionesVisibles === 0 && !hayMasOcultas) {
                htmlFinal = `<div class="text-center py-20"><p class="text-gray-500 text-lg mb-4">No hay noticias que coincidan con los filtros seleccionados.</p></div>`;
            }

            contenedor.innerHTML = htmlFinal;

            const btnVerAnteriores = document.getElementById('btn-ver-anteriores');
            if (btnVerAnteriores) {
                btnVerAnteriores.addEventListener('click', () => {
                    mostrarTodasAnteriores = true;
                    renderizarNoticias();
                });
            }

            (categoriaSeleccionada || fechaSeleccionada) ? btnLimpiar.classList.remove('hidden') : btnLimpiar.classList.add('hidden');
        }

        contenedor.addEventListener('click', (event) => {
            const enlaceClicked = event.target.closest('.link-noticia');
            if (enlaceClicked) {
                const cat = enlaceClicked.getAttribute('data-categoria');
                actualizarPuntuacion(cat);
            }
        });

        selectCategoria.addEventListener('change', renderizarNoticias);
        inputFecha.addEventListener('change', renderizarNoticias);
        btnLimpiar.addEventListener('click', () => { 
            selectCategoria.value = ''; 
            inputFecha.value = ''; 
            inputFecha.type = 'text'; 
            mostrarTodasAnteriores = false; 
            renderizarNoticias(); 
        });
        
        document.addEventListener('play', function(e){

            avatar.style.left = destinoLeft + "px";
