    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {

    <style>
        body {
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
        }
        .tarjeta-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .tarjeta-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.15);
        }
        .contenedor-imagen {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .contenedor-imagen img, .contenedor-imagen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            outline: none;
        }
        .titulo-noticia {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .resumen-noticia {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5rem; 
            min-height: 4.5rem;
        }
        .filtro-estilizado {
            background-color: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-estilizado::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }
        .marcador-audio {
            border: 1px solid #b8dfaa;
            background: #f7fbf5;
            color: #477f32;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .marcador-audio:hover,
        .marcador-audio:focus-visible {
            background: #6cc24a;
            color: #ffffff;
            transform: translateY(-1px);
            outline: none;
        }

        @keyframes popUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-pop-up {
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .latido-suave {
            animation: latido 3s ease-in-out infinite;
        }
    </style>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

      window.OneSignalDeferred = window.OneSignalDeferred || [];

        if (OneSignal.Slidedown) {

<body class="text-gray-800 antialiased pb-12 relative">

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TRL7Z8HF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    
    <header class="bg-white/95 backdrop-blur-md border-b-4 border-lm-green sticky top-0 z-50 shadow-sm px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Boletín Noticias</h1>
                <p class="text-sm text-gray-500 font-medium">Leroy Merlin</p>
            </div>
            
            <div class="flex flex-wrap justify-center items-center gap-3">
                
                <button id="btn-suscribir-push" class="flex items-center gap-2 border border-blue-500 text-blue-600 font-bold px-4 py-1.5 rounded-full text-sm hover:bg-blue-50 transition-colors focus:outline-none bg-white shadow-sm" title="Activar notificaciones">
                    🔔 Avisos
                </button>

                <div class="relative">
                    <select id="filtro-categoria" class="border border-lm-green text-lm-dark font-semibold px-5 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none filtro-estilizado pr-8 bg-transparent">
                        <option value="">Todas las categorías</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-lm-dark">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>

                <input 
                    type="text" 
                    id="filtro-fecha" 
                    placeholder="Filtrar por fecha" 
                    onfocus="(this.type='date')" 
                    onblur="if(!this.value) this.type='text'" 
                    class="border border-lm-green text-lm-dark font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-green-50 transition-colors focus:outline-none bg-transparent text-center min-w-[150px] cursor-pointer" 
                    title="Filtrar por fecha"
                >
                
                <button id="btn-limpiar" class="hidden border border-gray-300 text-gray-500 font-semibold px-4 py-1.5 rounded-full text-sm hover:bg-gray-100 transition-colors focus:outline-none">
                    Limpiar ✕
                </button>
            </div>
        </div>

    <main id="contenedor-boletines" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    </main>

    <script>
        document.getElementById('btn-suscribir-push').addEventListener('click', async () => {
            if (window.OneSignalDeferred) {
                window.OneSignalDeferred.push(async function(OneSignal) {
                    try {
                        if (!('Notification' in window)) {
                            alert("⚠️ Tu dispositivo o navegador no soporta notificaciones web.\n\nSi usas iPad o iPhone:\n1. Toca el botón de Compartir (arriba a la derecha).\n2. Dale a 'Añadir a la pantalla de inicio'.\n3. Abre el Boletín desde el icono nuevo y vuelve a pulsar este botón.");
                            return;
                        }

                        const permission = window.Notification.permission;
                        
                        if (permission === 'granted') {
                            alert("✅ ¡Ya estás suscrito! Te avisaremos cuando haya novedades.");
                        } else if (permission === 'denied') {
                            alert("❌ Tienes las notificaciones bloqueadas. Ve a los Ajustes de Safari/Chrome y permite las notificaciones para esta página.");
                        } else {
                            if (OneSignal.Slidedown) {
                                await OneSignal.Slidedown.promptPush();
                            } else {
                                await OneSignal.Notifications.requestPermission();
                            }
                        }
                    } catch (error) {
                        console.error("Error al intentar suscribir:", error);
                        alert("Hubo un error al intentar activar las notificaciones. Inténtalo de nuevo.");
                    }
                });
            } else {
                 alert("⏳ El sistema de notificaciones aún se está cargando. Espera un segundo y vuelve a intentarlo.");
            }
        });

        const CARPETA_ASSETS = "./archivos/";
        let EDICIONES_DEL_BOLETIN = []; 
        let mostrarTodasAnteriores = false;

        const contenedor = document.getElementById('contenedor-boletines');
        const selectCategoria = document.getElementById('filtro-categoria');
        const inputFecha = document.getElementById('filtro-fecha');
        const btnLimpiar = document.getElementById('btn-limpiar');

        function categoriaEditorial(categoria) {
            const categoriaNormalizada = (categoria || '').toLocaleLowerCase('es-ES');

            if (/ciber|seguridad/.test(categoriaNormalizada)) return 'Ciberseguridad';
            if (/educación|educacion|impacto social/.test(categoriaNormalizada)) return 'Personas y aprendizaje';
            if (/productividad|espacios de trabajo/.test(categoriaNormalizada)) return 'Productividad';
            if (/vídeo|video|imagen|visual/.test(categoriaNormalizada)) return 'Creación visual';
            if (/modelo|agente|fundacional/.test(categoriaNormalizada)) return 'Modelos y agentes';
            if (/robot|hardware|chip|periférico|periferico/.test(categoriaNormalizada)) return 'Robótica y hardware';
            if (/retail|negocio|regulación|regulacion|estrategia/.test(categoriaNormalizada)) return 'Estrategia y negocio';
            if (/marketing|seo|anuncio/.test(categoriaNormalizada)) return 'Marketing y visibilidad';
            if (/software|herramienta/.test(categoriaNormalizada)) return 'Herramientas IA';

            return 'Tendencias IA';
        }

        function claveMesEdicion(edicion) {
            const fechas = (edicion.noticias || [])
                .map(noticia => noticia.fechaISO)
                .filter(fecha => /^\d{4}-\d{2}-\d{2}$/.test(fecha))
                .sort((a, b) => b.localeCompare(a));

            return fechas[0] ? fechas[0].slice(0, 7) : null;
        }

        function etiquetaMesArchivo(claveMes) {
            if (!claveMes) return 'Ediciones anteriores';
            const etiqueta = new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' })
                .format(new Date(`${claveMes}-01T12:00:00`));
            return etiqueta.charAt(0).toUpperCase() + etiqueta.slice(1);
        }

        function crearMarcadoresAudio(edicion, audioId) {
            if (!Array.isArray(edicion.audioMomentos) || edicion.audioMomentos.length === 0) return '';

            const botones = edicion.audioMomentos.map(momento => `
                <button type="button" class="marcador-audio rounded-full px-3 py-2 text-xs font-bold text-left whitespace-nowrap" data-audio-id="${audioId}" data-segundo="${momento.segundo}" aria-label="Escuchar desde ${momento.etiqueta}: ${momento.titulo}">
                    <span class="mr-1 opacity-70">${momento.etiqueta}</span>${momento.titulo}
                </button>`).join('');

            return `
                <div class="w-full max-w-2xl mt-4" aria-label="Momentos del audio">
                    <p class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Escucha por temas</p>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">${botones}</div>
                </div>`;
        }

        async function cargarDatos() {
            try {
                const respuesta = await fetch('data.json?t=' + new Date().getTime());
                if (!respuesta.ok) throw new Error('No se pudo cargar el archivo data.json');
                EDICIONES_DEL_BOLETIN = await respuesta.json();
                inicializarCategorias();
                renderizarNoticias();
            } catch (error) {
                console.error("Error cargando noticias:", error);
                if (window.location.protocol === 'file:') {
                    contenedor.innerHTML = `<div class="max-w-xl mx-auto text-center py-20"><p class="text-lg font-bold text-gray-700 mb-2">Esta vista previa necesita abrirse desde una página web.</p><p class="text-sm text-gray-500 mb-5">Al abrir el archivo directamente, Chrome bloquea la lectura de las noticias.</p><a href="https://anniezpt.github.io/Leroy_Merlin-/" class="inline-flex rounded-full bg-lm-green px-5 py-3 text-sm font-bold text-white hover:bg-lm-dark transition-colors">Abrir el boletín publicado →</a></div>`;
                } else {
                    contenedor.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">Error cargando las noticias. Comprueba que el archivo data.json existe.</div>`;
                }
            }
        }

        function inicializarCategorias() {
            const todasLasCategorias = EDICIONES_DEL_BOLETIN.flatMap(edicion => 
                (edicion.noticias || []).map(noticia => categoriaEditorial(noticia.categoria))
            );
            const categoriasUnicas = [...new Set(todasLasCategorias)].sort();
            categoriasUnicas.forEach(cat => {
                if(!cat) return; 
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                selectCategoria.appendChild(option);
            });
        }

        function renderizarNoticias() {
            const categoriaSeleccionada = selectCategoria.value;
            const fechaSeleccionada = inputFecha.type === 'date' ? inputFecha.value : '';
            const hayFiltros = (categoriaSeleccionada !== "" || fechaSeleccionada !== "");
            
            let htmlFinal = '';
            let edicionesVisibles = 0;
            let hayMasOcultas = false;
            let archivoIniciado = false;
            let ultimoMesArchivo = null;

            const haceUnaSemana = new Date();
            haceUnaSemana.setDate(haceUnaSemana.getDate() - 7);

            EDICIONES_DEL_BOLETIN.forEach((edicion, indexEdicion) => {
                const noticiasFiltradas = (edicion.noticias || []).filter(noticia => {
                    if (noticia.visible === false) return false;
                    const cumpleCategoria = categoriaSeleccionada === "" || categoriaEditorial(noticia.categoria) === categoriaSeleccionada;
                    const cumpleFecha = fechaSeleccionada === "" || noticia.fechaISO === fechaSeleccionada;
                    return cumpleCategoria && cumpleFecha;
                });

                const mostrarBanner = edicion.bannerLanding && !hayFiltros;
                if (noticiasFiltradas.length === 0 && !mostrarBanner) return;

                let esReciente = (indexEdicion === 0); 
                noticiasFiltradas.forEach(noticia => {
                    if (noticia.fechaISO) {
                        const fechaNoticia = new Date(noticia.fechaISO);
                        if (fechaNoticia >= haceUnaSemana) esReciente = true;
                    }
                });

                if (!hayFiltros && !mostrarTodasAnteriores && !esReciente) {
                    hayMasOcultas = true;
                    return; 
                }

                const esLaMasNueva = edicionesVisibles === 0;
                const opacidad = esLaMasNueva ? '' : 'opacity-80';

                if (!hayFiltros && mostrarTodasAnteriores && !esLaMasNueva) {
                    const mesArchivo = claveMesEdicion(edicion);
                    if (!archivoIniciado) {
                        archivoIniciado = true;
                        htmlFinal += `
                        <div class="flex items-center justify-center mt-20 mb-10">
                            <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                            <span class="px-5 text-lm-dark text-sm font-bold uppercase tracking-widest whitespace-nowrap bg-[#f4f6f8]">Archivo de boletines</span>
                            <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                        </div>`;
                    }

                    if (mesArchivo !== ultimoMesArchivo) {
                        ultimoMesArchivo = mesArchivo;
                        htmlFinal += `
                        <div class="flex items-center gap-3 mb-6">
                            <span class="h-3 w-3 rounded-full bg-lm-green"></span>
                            <h2 class="text-lg font-bold text-gray-700">${etiquetaMesArchivo(mesArchivo)}</h2>
                            <div class="h-px flex-1 bg-gray-200"></div>
                        </div>`;
                    }
                } else if (!esLaMasNueva && edicionesVisibles > 0) {
                    htmlFinal += `
                    <div class="flex items-center justify-center mt-20 mb-14">
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                        <span class="px-5 text-lm-dark text-sm font-bold uppercase tracking-widest whitespace-nowrap bg-[#f4f6f8]">Noticias Anteriores</span>
                        <div class="h-[1px] bg-lm-green w-full rounded-full opacity-50"></div>
                    </div>`;
                }

                let tarjetasNoticias = '';

                if (mostrarBanner) {
                    const banner = edicion.bannerLanding;
                    let rutaImagenBanner = banner.imagen;
                    if (!rutaImagenBanner.startsWith('http') && !rutaImagenBanner.startsWith('./')) {
                        rutaImagenBanner = CARPETA_ASSETS + banner.imagen;
                    }
                    tarjetasNoticias += `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 mb-6">
                        <a href="${banner.enlace}" target="_blank" data-categoria="Especial" class="link-noticia block relative w-full h-[300px] md:h-[400px] rounded-2xl overflow-hidden shadow-md group">
                            <img src="${rutaImagenBanner}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" onerror="this.onerror=null; this.src='https://placehold.co/1200x400/e2e8f0/64748b?text=Banner+Leroy+Merlin'">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/30 to-transparent"></div>
                            <div class="absolute bottom-0 left-0 p-6 md:p-10 w-full flex flex-col items-start">
                                <span class="bg-lm-green text-white text-[10px] md:text-xs font-bold px-3 py-1 rounded shadow-sm uppercase mb-3">Especial Temático</span>
                                <h3 class="text-2xl md:text-4xl font-bold text-white mb-5 drop-shadow-md">${banner.titulo}</h3>
                                <span class="inline-flex items-center text-sm font-bold text-gray-900 bg-white hover:bg-lm-green hover:text-white px-5 py-2.5 rounded-full transition-all group-hover:px-6 shadow-lg">
                                    Leer el informe completo →
                                </span>
                            </div>
                        </a>
                    </div>`;
                }

                noticiasFiltradas.forEach(noticia => {
                    let htmlMultimedia = '';
                    const etiquetaCategoria = categoriaEditorial(noticia.categoria);
                    if (noticia.video) {
                        const rutaVideo = noticia.video.startsWith('http') ? noticia.video : CARPETA_ASSETS + noticia.video;
                        htmlMultimedia = `<video controls class="w-full h-full object-cover"><source src="${rutaVideo}" type="video/mp4"></video>`;
                    } else {
                        let imagenSrc = noticia.imagen && noticia.imagen.trim() !== "" ? noticia.imagen : 'https://placehold.co/600x400/e2e8f0/64748b?text=Leroy+Merlin';
                        if (!imagenSrc.startsWith('http') && !imagenSrc.includes('.')) imagenSrc = CARPETA_ASSETS + imagenSrc + '.png';
                        htmlMultimedia = `<img src="${imagenSrc}" alt="${noticia.titulo}" loading="lazy" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Cargando...'">`;
                    }

                    tarjetasNoticias += `
                    <article class="tarjeta-noticia bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                        <div class="contenedor-imagen ${esLaMasNueva ? '' : 'opacity-90'} relative">
                            ${htmlMultimedia}
                            <span title="${noticia.categoria}" class="absolute top-3 left-3 bg-white/90 text-lm-dark text-xs font-bold px-2.5 py-1 rounded shadow uppercase tracking-wide">${etiquetaCategoria}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex justify-end mb-3">
                                <span class="text-gray-400 text-xs font-semibold flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                    ${noticia.fechaTexto}
                                </span>
                            </div>
                            <h3 class="titulo-noticia font-bold text-xl mb-3 leading-snug text-gray-900" title="${noticia.titulo}">${noticia.titulo}</h3>
                            <p class="resumen-noticia text-gray-600 text-sm mb-6 flex-grow">${noticia.resumen}</p>
                            <a href="${noticia.enlace}" target="_blank" class="link-noticia text-sm font-bold text-lm-dark hover:text-lm-green transition-colors mt-auto inline-flex items-center group">
                                Leer noticia completa <span class="ml-1.5 group-hover:translate-x-1 transition-transform">→</span>
                            </a>
                        </div>
                    </article>`;
                });

                htmlFinal += `
                <section class="mb-16 ${opacidad} transition-all duration-300">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-8 w-full max-w-4xl mx-auto flex flex-col items-center">
                        <h2 class="text-center font-bold ${esLaMasNueva ? 'text-xl text-lm-dark' : 'text-lg text-gray-500'} ${edicion.audioSrc ? 'mb-4' : 'mb-0'}">${edicion.tituloAudio}</h2>
                        ${edicion.audioSrc ? `<audio id="audio-edicion-${indexEdicion}" controls preload="metadata" class="w-full max-w-2xl audio-boletin bg-gray-50 rounded-lg shadow-inner"><source src="${CARPETA_ASSETS}${edicion.audioSrc}"></audio>${crearMarcadoresAudio(edicion, `audio-edicion-${indexEdicion}`)}` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch">${tarjetasNoticias}</div>
                </section>`;
                edicionesVisibles++;
            });

            if (hayMasOcultas) {
                htmlFinal += `
                <div class="text-center mt-2 mb-16 animate-pop-up">
                    <button id="btn-ver-anteriores" class="bg-white border-2 border-lm-green text-lm-dark font-bold py-3 px-8 rounded-full hover:bg-lm-green hover:text-white transition-colors shadow-sm">
                        Ver boletines de semanas anteriores ⬇️
                    </button>
                </div>`;
            }

            if (edicionesVisibles === 0 && !hayMasOcultas) {
                htmlFinal = `<div class="text-center py-20"><p class="text-gray-500 text-lg mb-4">No hay noticias que coincidan con los filtros seleccionados.</p></div>`;
            }

            contenedor.innerHTML = htmlFinal;

            const btnVerAnteriores = document.getElementById('btn-ver-anteriores');
            if (btnVerAnteriores) {
                btnVerAnteriores.addEventListener('click', () => {
                    mostrarTodasAnteriores = true;
                    renderizarNoticias();
                });
            }

            (categoriaSeleccionada || fechaSeleccionada) ? btnLimpiar.classList.remove('hidden') : btnLimpiar.classList.add('hidden');
        }

        contenedor.addEventListener('click', (event) => {
            const marcadorAudio = event.target.closest('[data-audio-id]');
            if (!marcadorAudio) return;

            const audio = document.getElementById(marcadorAudio.dataset.audioId);
            const segundo = Number(marcadorAudio.dataset.segundo);
            if (!audio || !Number.isFinite(segundo)) return;

            const reproducirDesdeMomento = () => {
                audio.currentTime = segundo;
                audio.play().catch(() => {});
            };

            if (audio.readyState >= 1) {
                reproducirDesdeMomento();
            } else {
                audio.addEventListener('loadedmetadata', reproducirDesdeMomento, { once: true });
                audio.load();
            }
        });

        selectCategoria.addEventListener('change', renderizarNoticias);
        inputFecha.addEventListener('change', renderizarNoticias);
        btnLimpiar.addEventListener('click', () => { 
            selectCategoria.value = ''; 
            inputFecha.value = ''; 
            inputFecha.type = 'text'; 
            mostrarTodasAnteriores = false; 
            renderizarNoticias(); 
        });
        
        document.addEventListener('play', function(e){
            var audios = document.getElementsByTagName('audio');
            for(var i = 0, len = audios.length; i < len;i++){
                if(audios[i] != e.target) audios[i].pause();
            }
        }, true);

        cargarDatos();

    </script>
</body>
</html>
