    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletín Noticias - Leroy Merlin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lm-green': '#6cc24a',
                        'lm-dark': '#5aa33e',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
        }
        .tarjeta-noticia {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
        }
        .tarjeta-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.15);
        }
        .contenedor-imagen {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e2e8f0;
        }
        .contenedor-imagen img, .contenedor-imagen video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        audio {
            width: 100%;
            height: 45px;
            border-radius: 8px;
            outline: none;
        }
        .line-clamp-4-exact {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5rem; 
            min-height: 6rem; 
        }
        .filtro-estilizado {
            background-color: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }
        .filtro-estilizado::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
        }

        @keyframes popUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .animate-pop-up {
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .latido-suave {
            animation: latido 3s ease-in-out infinite;
        }
    </style>

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "a911aeb6-7ef9-41d3-9b76-6a5b3dfa9df2",
          notifyButton: {
            enable: true,
            size: 'medium',
            theme: 'default',
            position: 'bottom-left',
            text: {
                'tip.state.unsubscribed': '¡Suscríbete a las alertas!',
                'tip.state.subscribed': 'Estás suscrito a los avisos',
                'tip.state.blocked': 'Has bloqueado las notificaciones',
                'message.prenotify': 'Haz clic para recibir avisos cuando suba noticias nuevas',
                'message.action.subscribed': '¡Gracias por suscribirte!',
                'message.action.resubscribed': '¡Estás suscrito de nuevo!',
                'message.action.unsubscribed': 'Ya no recibirás avisos',
                'dialog.main.title': 'Notificaciones del Boletín',
                'dialog.main.button.subscribe': 'SUSCRIBIRME',
                'dialog.main.button.unsubscribe': 'DARME DE BAJA',
            }
          }
        });
        
        // Magia anti-Apple: Forzamos el cartel nativo grande por si no sale la campana
        OneSignal.showSlidedownPrompt();
      });
    </script>
